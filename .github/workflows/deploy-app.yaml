name: Deploy shinylive app

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: rstudio/shiny-workflows/setup-r-package@v1
        with:
          packages: |
            renv
            posit-dev/r-shinylive
            sessioninfo
          cache-version: ${{ github.event.inputs.cache-version }}

      - name: Find app dependencies
        shell: Rscript {0}
        id: packages
        run: |
          # Find package dependencies using {renv} and install with {pak}
          pak::pak(
            unique(renv::dependencies('.')$Package)
          )

      - name: Build app
        shell: Rscript {0}
        run: |
          shinylive::export('shiny', 'site')
          file.create(here::here('site', '.nojekyll'))
          index_html = here::here('site', 'index.html') |>
            xml2::read_html()
          title_node = xml2::xml_find_first(index_html, "//head/title")
          xml2::xml_text(title_node) = 'Example EPA Atrazine Dashboard'
          xml2::xml_add_sibling(title_node, 'link', rel = 'icon', type = 'image/png', href = 'data:image/png;base64,', .where = 'after')
          xml2::write_html(index_html, here::here('site', 'index.html'))

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build

    permissions:
      pages: write
      id-token: write 

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
